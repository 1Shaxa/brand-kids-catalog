<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Brand Kids</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Admin Login</h2>
            <input type="text" id="admin-user" placeholder="Username">
            <input type="password" id="admin-pass" placeholder="Password">
            <button onclick="checkLogin()" class="btn-primary" style="width: 100%;">Войти в панель</button>
            <p id="login-error" style="color: red; margin-top: 15px; font-size: 13px;"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="admin-dashboard" style="display: none; width: 100%;">
        <aside class="sidebar">
            <div class="sidebar-brand">Brand Kids</div>
            <nav class="sidebar-nav">
                <div onclick="showTab('inventory')" class="nav-item active" id="tab-inv">Инвентарь</div>
                <div onclick="showTab('categories')" class="nav-item" id="tab-cat">Категории</div>
                <div onclick="showTab('settings')" class="nav-item" id="tab-set">Настройки</div>
                <div class="nav-item" onclick="location.href='index.html'">На сайт →</div>
                <div class="nav-item" onclick="logout()" style="margin-top: auto; color: #ff4d4f;">Выход</div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="top-bar">
                <div class="search-area">
                    <input type="text" placeholder="Поиск по инвентарю..." oninput="handleAdminSearch(this.value)" style="padding: 10px; border: 1px solid #eee; width: 300px;">
                </div>
                <div class="admin-actions" style="display: flex; align-items: center; gap: 20px;">
                    <div class="lang-dropdown" id="admin-lang-dropdown">
                        <div class="lang-current" onclick="toggleAdminLang(event)">
                            <span id="admin-lang-label">RU</span>
                        </div>
                        <div class="lang-options">
                            <div class="lang-option" onclick="selectAdminLang('ru')">Русский</div>
                            <div class="lang-option" onclick="selectAdminLang('uz')">O'zbekcha</div>
                            <div class="lang-option" onclick="selectAdminLang('en')">English</div>
                        </div>
                    </div>
                    <button onclick="openAddModal()" class="btn-primary">+ Новый товар</button>
                </div>
            </header>

            <main class="content-body">
                <!-- Inventory Tab -->
                <div id="tab-inventory-content">
                    <div class="page-header">
                        <h1>Инвентарь</h1>
                    </div>
                    <div class="card">
                        <table class="inventory-table">
                            <thead>
                                <tr>
                                    <th>Фото</th>
                                    <th>Название</th>
                                    <th>Раздел</th>
                                    <th>Размеры</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-list">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Categories Tab -->
                <div id="tab-categories-content" style="display: none;">
                    <div class="page-header">
                        <h1>Категории</h1>
                        <button onclick="openCategoryModal()" class="btn-outline">+ Добавить категорию</button>
                    </div>
                    <div class="card" id="category-list">
                        <!-- Loaded via JS -->
                    </div>
                </div>

                <!-- Settings Tab -->
                <div id="tab-settings-content" style="display: none;">
                    <div class="page-header">
                        <h1>Настройки сайта</h1>
                    </div>
                    <form id="settings-form" class="admin-form card">
                        <label>Заголовок Hero (RU / UZ / EN)</label>
                        <input type="text" id="set-title-ru" placeholder="RU">
                        <input type="text" id="set-title-uz" placeholder="UZ">
                        <input type="text" id="set-title-en" placeholder="EN">
                        
                        <label>Описание Hero (RU / UZ / EN)</label>
                        <textarea id="set-desc-ru" placeholder="RU"></textarea>
                        <textarea id="set-desc-uz" placeholder="UZ"></textarea>
                        <textarea id="set-desc-en" placeholder="EN"></textarea>
                        
                        <button type="button" onclick="saveSettings()" class="btn-primary">Сохранить изменения</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals (Add Product) -->
    <div class="modal-overlay" id="product-modal" style="display:none; position:fixed; inset:0; z-index:1000; align-items:center; justify-content:center;">
        <div class="admin-modal card" style="width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2 id="modal-type-title">Товар</h2>
                <button onclick="closeAdminModal()" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
            </div>
            <form id="product-form" class="admin-form">
                <input type="hidden" id="edit-id">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
                    <div>
                        <label>Название RU</label><input type="text" id="name-ru" required>
                        <label>Название UZ</label><input type="text" id="name-uz" required>
                        <label>Название EN</label><input type="text" id="name-en" required>
                        
                        <label>Раздел</label>
                        <select id="prod-category">
                            <option value="boys">Мальчики</option>
                            <option value="girls">Девочки</option>
                            <option value="baby">Малыши</option>
                        </select>
                        
                        <label>Категория</label>
                        <select id="prod-sub-category"></select>
                    </div>
                    <div>
                        <label>Размеры (через запятую)</label>
                        <input type="text" id="prod-sizes">
                        
                        <label>Фотографии (Главное и доп. ракурсы)</label>
                        <div class="multi-upload-grid">
                            <div class="img-preview" id="preview-1" onclick="document.getElementById('img-1').click()"><span>+</span></div>
                            <div class="img-preview" id="preview-2" onclick="document.getElementById('img-2').click()"><span>+</span></div>
                            <div class="img-preview" id="preview-3" onclick="document.getElementById('img-3').click()"><span>+</span></div>
                            <div class="img-preview" id="preview-4" onclick="document.getElementById('img-4').click()"><span>+</span></div>
                        </div>
                        <input type="file" id="img-1" hidden onchange="previewMultiImg(event, 1)">
                        <input type="file" id="img-2" hidden onchange="previewMultiImg(event, 2)">
                        <input type="file" id="img-3" hidden onchange="previewMultiImg(event, 3)">
                        <input type="file" id="img-4" hidden onchange="previewMultiImg(event, 4)">
                        
                        <label>Описание RU</label><textarea id="desc-ru"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="save-product-btn" style="width:100%; margin-top:20px;">Сохранить товар</button>
            </form>
        </div>
    </div>

    <!-- Category Modal -->
    <div class="modal-overlay" id="category-modal" style="display:none; position:fixed; inset:0; z-index:1000; align-items:center; justify-content:center;">
        <div class="card" style="width: 400px;">
            <h2>Добавить категорию</h2>
            <form id="category-form" onsubmit="addCategory(event)" class="admin-form" style="margin-top:20px;">
                <input type="text" id="cat-name-ru" placeholder="RU" required>
                <input type="text" id="cat-name-uz" placeholder="UZ" required>
                <input type="text" id="cat-name-en" placeholder="EN" required>
                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn-primary">Создать</button>
                    <button type="button" onclick="closeCategoryModal()" class="btn-outline">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
