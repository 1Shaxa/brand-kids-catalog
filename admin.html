<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Brand Kids</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">Brand<span>Kids</span></div>
            <p class="login-sub">Панель управления</p>
            <label for="admin-user">Имя пользователя</label>
            <input type="text" id="admin-user" placeholder="Введите логин">
            <label for="admin-pass">Пароль</label>
            <input type="password" id="admin-pass" placeholder="Введите пароль" onkeydown="if(event.key==='Enter') checkLogin()">
            <button onclick="checkLogin()" class="btn-primary" style="width:100%; justify-content:center;">Войти в панель</button>
            <p id="login-error" style="color:#e84545; margin-top:14px; font-size:13px;"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="admin-dashboard" style="display:none; width:100%;">
        <aside class="sidebar">
            <div class="sidebar-brand">Brand<span>Kids</span></div>
            <nav class="sidebar-nav">
                <button onclick="showTab('inventory')" class="nav-item active" id="tab-inv">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                    Инвентарь
                </button>
                <button onclick="showTab('categories')" class="nav-item" id="tab-cat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
                    Категории
                </button>
                <button onclick="showTab('settings')" class="nav-item" id="tab-set">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    Настройки
                </button>
                <button class="nav-item" onclick="location.href='index.html'">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    На сайт →
                </button>
                <button onclick="logout()" class="nav-item nav-item-danger">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Выход
                </button>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="top-bar">
                <div class="search-area">
                    <input type="text" placeholder="Поиск по инвентарю..." oninput="handleAdminSearch(this.value)">
                </div>
                <div class="admin-actions">
                    <div class="lang-dropdown" id="admin-lang-dropdown">
                        <div class="lang-current" onclick="toggleAdminLang(event)">
                            <span id="admin-lang-label">RU</span>
                        </div>
                        <div class="lang-options">
                            <div class="lang-option" onclick="selectAdminLang('ru')">Русский</div>
                            <div class="lang-option" onclick="selectAdminLang('uz')">O'zbekcha</div>
                            <div class="lang-option" onclick="selectAdminLang('en')">English</div>
                        </div>
                    </div>
                    <button onclick="openAddModal()" class="btn-primary">+ Новый товар</button>
                </div>
            </header>

            <main class="content-body">

                <!-- Inventory Tab -->
                <div id="tab-inventory-content">
                    <div class="page-header">
                        <h1>Инвентарь</h1>
                    </div>
                    <div class="card">
                        <table class="inventory-table">
                            <thead>
                                <tr>
                                    <th>Фото</th>
                                    <th>Название</th>
                                    <th>Раздел</th>
                                    <th>Размеры</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-list"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Categories Tab -->
                <div id="tab-categories-content" style="display:none;">
                    <div class="page-header">
                        <h1>Категории</h1>
                        <button onclick="openCategoryModal()" class="btn-outline">+ Добавить категорию</button>
                    </div>
                    <div class="card" id="category-list"></div>
                </div>

                <!-- Settings Tab -->
                <div id="tab-settings-content" style="display:none;">
                    <div class="page-header">
                        <h1>Настройки сайта</h1>
                    </div>
                    <form id="settings-form" class="admin-form card">
                        <label>Заголовок Hero — RU</label>
                        <input type="text" id="set-title-ru" placeholder="RU">
                        <label>Заголовок Hero — UZ</label>
                        <input type="text" id="set-title-uz" placeholder="UZ">
                        <label>Заголовок Hero — EN</label>
                        <input type="text" id="set-title-en" placeholder="EN">

                        <label>Описание Hero — RU</label>
                        <textarea id="set-desc-ru" placeholder="RU"></textarea>
                        <label>Описание Hero — UZ</label>
                        <textarea id="set-desc-uz" placeholder="UZ"></textarea>
                        <label>Описание Hero — EN</label>
                        <textarea id="set-desc-en" placeholder="EN"></textarea>

                        <button type="button" onclick="saveSettings()" class="btn-primary">Сохранить изменения</button>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal" style="display:none; position:fixed; inset:0; z-index:1000;">
        <div class="admin-modal">
            <div class="modal-header">
                <h2 id="modal-type-title">Новый товар</h2>
                <button onclick="closeAdminModal()" class="modal-close-btn">&times;</button>
            </div>
            <form id="product-form" class="admin-form">
                <input type="hidden" id="edit-id">
                <div class="form-grid">
                    <div>
                        <label>Название — RU</label>
                        <input type="text" id="name-ru" required>
                        <label>Название — UZ</label>
                        <input type="text" id="name-uz" required>
                        <label>Название — EN</label>
                        <input type="text" id="name-en" required>

                        <label>Раздел</label>
                        <select id="prod-category">
                            <option value="boys">Мальчики</option>
                            <option value="girls">Девочки</option>
                            <option value="baby">Малыши</option>
                        </select>

                        <label>Категория</label>
                        <select id="prod-sub-category"></select>

                        <label>Описание — RU</label>
                        <textarea id="desc-ru"></textarea>
                    </div>
                    <div>
                        <label>Размеры (через запятую)</label>
                        <input type="text" id="prod-sizes" placeholder="2, 4, 6, 8, 10">

                        <label>Фотографии (главное + доп. ракурсы)</label>
                        <div class="multi-upload-grid">
                            <div class="img-preview" id="preview-1" onclick="document.getElementById('img-1').click()">+</div>
                            <div class="img-preview" id="preview-2" onclick="document.getElementById('img-2').click()">+</div>
                            <div class="img-preview" id="preview-3" onclick="document.getElementById('img-3').click()">+</div>
                            <div class="img-preview" id="preview-4" onclick="document.getElementById('img-4').click()">+</div>
                        </div>
                        <input type="file" id="img-1" hidden onchange="previewMultiImg(event, 1)">
                        <input type="file" id="img-2" hidden onchange="previewMultiImg(event, 2)">
                        <input type="file" id="img-3" hidden onchange="previewMultiImg(event, 3)">
                        <input type="file" id="img-4" hidden onchange="previewMultiImg(event, 4)">
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="save-product-btn" style="width:100%; justify-content:center; margin-top:8px;">Сохранить товар</button>
            </form>
        </div>
    </div>

    <!-- Category Modal -->
    <div class="modal-overlay" id="category-modal" style="display:none; position:fixed; inset:0; z-index:1000;">
        <div class="admin-modal" style="max-width:420px;">
            <div class="modal-header">
                <h2>Добавить категорию</h2>
                <button onclick="closeCategoryModal()" class="modal-close-btn">&times;</button>
            </div>
            <form id="category-form" onsubmit="addCategory(event)" class="admin-form">
                <label>Название — RU</label>
                <input type="text" id="cat-name-ru" placeholder="Русский" required>
                <label>Название — UZ</label>
                <input type="text" id="cat-name-uz" placeholder="O'zbekcha" required>
                <label>Название — EN</label>
                <input type="text" id="cat-name-en" placeholder="English" required>
                <div style="display:flex; gap:10px; margin-top:4px;">
                    <button type="submit" class="btn-primary">Создать</button>
                    <button type="button" onclick="closeCategoryModal()" class="btn-outline">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
